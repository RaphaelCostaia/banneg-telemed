<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banneg Telemedicina — Contratação</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
  html { color-scheme: light; }
  body { background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .co-wrap { max-width: 540px; margin: 0 auto; padding: 0 0 48px; }
  .co-head { position: relative; overflow: hidden; background: linear-gradient(140deg, #0f766e 0%, #0d9488 55%, #14b8a6 100%); color: #fff; padding: 32px 22px 30px; text-align: center; }
  .co-head::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .co-head .logo { font-weight: 800; font-size: 23px; letter-spacing: -.01em; position: relative; }
  .co-head .sub { color: #d7fbf3; font-size: 13.5px; margin-top: 6px; position: relative; }
  .co-card { background: #fff; margin: 14px; border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow-sm); }
  .co-card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; text-align: center; cursor: pointer; background: #fff; transition: border-color .14s, box-shadow .14s, background .14s; }
  .opt:hover { border-color: var(--brand); }
  .opt.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 3px rgba(13,148,136,.13); }
  .opt .n { font-weight: 700; }
  .opt .p { color: var(--brand-d); font-weight: 800; font-size: 18px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .opt .s { font-size: 11px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; min-width: 0; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  input, select { width: 100%; max-width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); transition: border-color .14s, box-shadow .14s; }
  input[type=date] { min-height: 46px; }
  input::placeholder { color: var(--faint); }
  select option { color: var(--ink); background: #fff; }
  input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,148,136,.16); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 0 4px; border-top: 1px dashed var(--line); margin-top: 6px; }
  .total .v { font-size: 27px; font-weight: 800; color: var(--brand-d); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .total .d { font-size: 12px; color: var(--muted); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-2); margin: 10px 2px 0; line-height: 1.45; }
  .consent input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--brand); cursor: pointer; }
  .cta { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(13,148,136,.32); transition: background .14s, transform .05s, box-shadow .14s; }
  .cta:hover { background: var(--brand-d); box-shadow: 0 4px 14px rgba(13,148,136,.4); }
  .cta:active { transform: translateY(1px); }
  .cta:disabled { opacity: .6; box-shadow: none; }
  .dep { border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-top: 10px; background: var(--soft); }
  .dep .h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
  .linkbtn { background: none; border: none; color: var(--brand-d); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }
  .erro { background: var(--bad-soft); color: #b91c1c; padding: 11px 13px; border-radius: 10px; font-size: 14px; margin: 0 14px 12px; display: none; }
  .pixbox { background: var(--soft); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; word-break: break-all; font-family: ui-monospace, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .trust { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 2px 14px 0; color: var(--muted); font-size: 12px; }
  .trust span { display: inline-flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
<div class="co-wrap">
  <div class="co-head">
    <div class="logo">Banneg Telemedicina</div>
    <div class="sub">Atendimento médico 24h • sem carência • para toda a família</div>
  </div>

  <div class="trust" style="margin-top:14px">
    <span>🩺 Consultas 24h</span><span>⚡ Sem carência</span><span>🔒 Pagamento seguro</span>
  </div>

  <div class="erro" id="erro"></div>

  <form id="form" onsubmit="return false">
    <div class="co-card">
      <h3>Escolha o plano</h3>
      <div class="pick" id="planos"></div>
    </div>

    <div class="co-card">
      <h3>Forma de pagamento</h3>
      <div class="pick" id="formas"></div>
    </div>

    <div class="co-card">
      <h3>Seus dados</h3>
      <div class="field"><label>Nome completo</label><input id="t_nome" placeholder="Nome e sobrenome" /></div>
      <div class="row2">
        <div class="field"><label>CPF</label><input id="t_cpf" inputmode="numeric" placeholder="000.000.000-00" /></div>
        <div class="field"><label>Nascimento</label><input id="t_nasc" type="date" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Sexo</label><select id="t_sexo"></select></div>
        <div class="field"><label>Estado civil</label><select id="t_estciv"></select></div>
      </div>
      <div class="field"><label>Nome da mãe</label><input id="t_mae" placeholder="Nome completo da mãe" /></div>
      <div class="field"><label>E-mail</label><input id="t_email" type="email" placeholder="voce@email.com" /></div>
      <div class="field"><label>Celular (WhatsApp)</label><input id="t_celular" inputmode="numeric" placeholder="DDD + número — ex: 17 99119 2822" /></div>
    </div>

    <div class="co-card" id="boxDeps" hidden>
      <h3>Dependentes <span class="muted" id="depInfo" style="font-weight:400;font-size:12px"></span></h3>
      <div id="deps"></div>
      <button class="linkbtn" type="button" id="addDep" style="margin-top:10px">+ Adicionar dependente</button>
    </div>

    <div class="co-card">
      <div class="total"><div><div style="font-weight:700">Total mensal</div><div class="d" id="totalDet"></div></div><div class="v" id="total">R$ 0,00</div></div>
      <label class="consent"><input type="checkbox" id="consent" /> Autorizo o uso dos meus dados para a contratação da Telemedicina Medicar e concordo com a cobrança mensal recorrente.</label>
      <button class="cta" id="submit" type="button" style="margin-top:14px">Finalizar e gerar pagamento</button>
      <p class="center muted" style="font-size:12px;margin:10px 2px 0">🔒 Seus dados são usados apenas para a contratação. Pagamento processado pelo Asaas.</p>
    </div>
  </form>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
const BRL = (n) => (n ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const qs = new URLSearchParams(location.search);
let META = {}, planoSel = null, deps = [];
let forma = "CREDIT_CARD"; // cartão (default) | PIX | BOLETO
const leadId = (qs.get("lead") || "").trim(); // id do lead (remoteJid) p/ casar o follow-up
const val = (id) => document.getElementById(id).value.trim();

async function init() {
  META = await (await fetch("/api/checkout/meta")).json();
  fill("t_sexo", META.sexos, true);
  fill("t_estciv", META.estadosCivis, true);

  document.getElementById("formas").innerHTML = Object.entries(META.formasPagamento).map(([k, v]) =>
    `<div class="opt${k === forma ? " sel" : ""}" data-k="${k}" onclick="selForma('${k}')">
       <div class="n">${v}</div></div>`).join("");
  renderPlanos();

  const pQ = qs.get("plano");
  selPlano(META.planos[pQ] ? pQ : "individual");

  document.getElementById("addDep").onclick = addDep;
  document.getElementById("submit").onclick = enviar;
}
function renderPlanos() {
  const lbl = (META.formasPagamento?.[forma] || "").toLowerCase();
  document.getElementById("planos").innerHTML = Object.values(META.planos).map(p =>
    `<div class="opt${planoSel && planoSel.id === p.id ? " sel" : ""}" data-id="${p.id}" onclick="selPlano('${p.id}')">
       <div class="n">${p.nome}</div><div class="p">${BRL(p.preco[forma])}</div>
       <div class="s">por mês · ${lbl}</div></div>`).join("");
}
function selForma(k) {
  if (!META.formasPagamento[k]) return;
  forma = k;
  document.querySelectorAll("#formas .opt").forEach(e => e.classList.toggle("sel", e.dataset.k === k));
  renderPlanos();
  total();
}
function fill(id, map, blank) {
  document.getElementById(id).innerHTML = (blank ? `<option value="">—</option>` : "") +
    Object.entries(map).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
}
function selPlano(id) {
  planoSel = META.planos[id];
  document.querySelectorAll("#planos .opt").forEach(e => e.classList.toggle("sel", e.dataset.id === id));
  document.getElementById("boxDeps").hidden = planoSel.maxDependentes === 0;
  if (deps.length > planoSel.maxDependentes) deps = deps.slice(0, planoSel.maxDependentes);
  renderDeps();
  total();
}
function addDep() {
  if (deps.length >= planoSel.maxDependentes) { alert(`Este plano permite até ${planoSel.maxDependentes} dependente(s).`); return; }
  deps.push({ nome: "", cpf: "", nascimento: "", sexo: "", grau: "05", mae: "" });
  renderDeps();
}
function rmDep(i) { deps.splice(i, 1); renderDeps(); }
function renderDeps() {
  document.getElementById("depInfo").textContent = `(${deps.length}/${planoSel.maxDependentes})`;
  document.getElementById("addDep").disabled = deps.length >= planoSel.maxDependentes;
  const grau = Object.entries(META.graus).filter(([k]) => k !== "00").map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  const sexo = `<option value="">—</option>` + Object.entries(META.sexos).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  document.getElementById("deps").innerHTML = deps.map((d, i) => `
    <div class="dep">
      <div class="h">Dependente ${i + 1} <button class="linkbtn" type="button" onclick="rmDep(${i})">remover</button></div>
      <div class="field"><label>Nome completo</label><input value="${d.nome}" oninput="deps[${i}].nome=this.value" /></div>
      <div class="row2">
        <div class="field"><label>Parentesco</label><select onchange="deps[${i}].grau=this.value">${grau}</select></div>
        <div class="field"><label>Nascimento</label><input type="date" value="${d.nascimento}" oninput="deps[${i}].nascimento=this.value" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Sexo</label><select onchange="deps[${i}].sexo=this.value">${sexo}</select></div>
        <div class="field"><label>CPF (se ≥18)</label><input value="${d.cpf}" oninput="deps[${i}].cpf=this.value" /></div>
      </div>
      <div class="field"><label>Nome da mãe</label><input value="${d.mae}" oninput="deps[${i}].mae=this.value" /></div>
    </div>`).join("");
  deps.forEach((d, i) => { const c = document.querySelectorAll("#deps .dep")[i]; if (c) { const s = c.querySelectorAll("select"); s[0].value = d.grau || "05"; s[1].value = d.sexo || ""; } });
  total();
}
function calcValor() {
  if (!planoSel) return null;
  const base = planoSel.preco?.[forma]; if (base == null) return null;
  const vidas = 1 + deps.length;
  if (planoSel.adicionalPorVida && vidas > planoSel.vidasBase) return base + (vidas - planoSel.vidasBase) * planoSel.adicionalPorVida;
  return base;
}
function total() {
  if (!planoSel) return;
  const v = calcValor(); const vidas = 1 + deps.length;
  document.getElementById("total").textContent = v == null ? "—" : BRL(v);
  document.getElementById("totalDet").textContent = `${vidas} vida${vidas > 1 ? "s" : ""} · ${META.formasPagamento?.[forma] || forma}`;
}
function erro(msg) { const e = document.getElementById("erro"); e.textContent = msg; e.style.display = "block"; window.scrollTo(0, 0); }

async function enviar() {
  document.getElementById("erro").style.display = "none";
  const cel = val("t_celular").replace(/\D/g, "");
  const t = { nome: val("t_nome"), cpf: val("t_cpf"), nascimento: val("t_nasc"), sexo: val("t_sexo"),
    estciv: val("t_estciv"), mae: val("t_mae"), email: val("t_email"),
    ddd: cel.slice(0, 2), telefone: cel.slice(2) };
  if (!t.nome || t.cpf.replace(/\D/g, "").length !== 11) return erro("Confira seu nome e CPF (11 dígitos).");
  if (!t.nascimento || !t.sexo || !t.estciv || !t.mae) return erro("Preencha nascimento, sexo, estado civil e nome da mãe.");
  for (const [i, d] of deps.entries()) if (!d.nome || !d.nascimento) return erro(`Preencha nome e nascimento do dependente ${i + 1}.`);
  if (!document.getElementById("consent").checked) return erro("Marque a autorização para continuar.");

  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "Gerando pagamento…";
  try {
    const r = await fetch("/api/checkout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo_plano: planoSel.id, billingType: forma, consentimento: true, titular: t, dependentes: deps, externalId: leadId || undefined }),
    }).then(r => r.json());
    if (r.erro) throw new Error(r.erro);
    sucesso(r);
  } catch (e) { erro(e.message); btn.disabled = false; btn.textContent = "Finalizar e gerar pagamento"; }
}

function sucesso(r) {
  const label = r.billingType === "PIX" ? "💠 Pagar com Pix" : r.billingType === "BOLETO" ? "📄 Ver boleto" : "💳 Pagar com cartão";
  const pag = r.paymentLink
    ? `<a class="cta" style="display:block;text-align:center;text-decoration:none" href="${r.paymentLink}" target="_blank">${label}</a>`
    : `<p class="muted">O link de pagamento será gerado em instantes.</p>`;
  const pix = r.pixCopiaECola
    ? `<div class="co-card" style="margin:12px 0 0;padding:14px">
         <p style="margin:0 0 6px;font-size:13px;font-weight:700">Pix copia e cola</p>
         <p id="pixcode" style="word-break:break-all;font-size:12px;font-family:ui-monospace,Consolas,monospace;background:#f8fafc;padding:10px;border-radius:8px;margin:0">${r.pixCopiaECola}</p>
         <button class="linkbtn" type="button" onclick="copiarPix()" style="margin-top:8px">Copiar código Pix</button>
       </div>`
    : "";
  document.getElementById("modalBox").innerHTML = `
    <h2 style="margin-top:0">✅ Quase lá!</h2>
    <p>Seu plano <b>${r.plano}</b> — <b>${BRL(r.valor)}/mês</b>.</p>
    ${pag}
    ${pix}
    <div class="co-card" style="margin:14px 0 0;padding:14px;background:#f0fdfa;border-color:#99f6e4">
      <p style="margin:0;font-size:14px">📩 <b>Confira seu e-mail após o pagamento.</b></p>
      <p class="muted" style="margin:6px 0 0;font-size:13px">Você recebe a confirmação do pagamento no seu e-mail (olhe também o spam). Após a confirmação, seu acesso à Telemedicina é liberado em <b>até 24 horas</b> e os dados de acesso chegam até você por e-mail. 💙</p>
    </div>`;
  document.getElementById("modalBg").classList.add("show");
}
function copiarPix() {
  const code = document.getElementById("pixcode").textContent;
  navigator.clipboard.writeText(code).then(() => alert("Código Pix copiado! Cole no app do seu banco.")).catch(() => {});
}

init();
</script>
</body>
</html>
